[project]
name = "sec-analyst-agent"
version = "0.1.0"
description = "Slack agent that answers questions about US-listed companies from SEC filings, with citations."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "anthropic>=2.14.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.4",
    "sentence-transformers>=6.3.0",
    "slack-bolt>=1.30.0",
    "sqlglot>=30.35.0",
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs the Postgres container (run with `make test`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# CPU-only PyTorch: embeddings run on CPU inside Docker, so the (much larger)
# CUDA build that PyPI ships for Linux x86 is never needed.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
